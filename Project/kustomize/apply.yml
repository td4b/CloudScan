kind: ConfigMap
metadata:
  name: external-scan
  namespace: monitoring
---
apiVersion: v1
data:
  values.yaml: "datasources:\n  datasources.yaml:\n    apiVersion: 1\n    datasources:\n
    \     - name: Elasticsearch\n        type: elasticsearch\n        url: https://elasticsearch-master:9200\n
    \       access: proxy\n        basicAuth: true\n        basicAuthUser: \"elastic\"
    \         # Set the username\n        secureJsonData:\n          basicAuthPassword:
    \"elastic\"    # Set the password\n        jsonData:\n          tlsSkipVerify:
    true             # Skip TLS verification\n          esVersion: 7                    #
    Elasticsearch version (adjust if needed)\n          timeField: \"@timestamp\"
    \        # Default timestamp field for Elasticsearch\n          index: \"domains-*\"
    \             # Set the index pattern\n\ndashboardProviders:\n  dashboardproviders.yaml:\n
    \   apiVersion: 1\n    providers:\n      - name: 'External Scans'\n        orgId:
    1\n        folder: ''\n        type: file\n        disableDeletion: false\n        editable:
    true\n        updateIntervalSeconds: 10\n        options:\n          path: /var/lib/grafana/dashboards\n
    \         foldersFromFilesStructure: true\n\nextraConfigmapMounts: \n  - name:
    external-scan\n    mountPath: /var/lib/grafana/dashboards\n    subPath: \"\"\n
    \   configMap: external-scan\n    readOnly: true\n    optional: false"
kind: ConfigMap
metadata:
  name: grafana-values
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: elastic-credentials
  namespace: monitoring
stringData:
  password: elastic
  username: elastic
type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
  namespace: monitoring
spec:
  chart:
    spec:
      chart: elasticsearch
      sourceRef:
        kind: HelmRepository
        name: elastic-repo
        namespace: flux-system
      version: 8.5.1
  interval: 1m
  releaseName: elastic
  valuesFrom:
  - kind: ConfigMap
    name: elastic-values
    valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      version: 8.6.0
  interval: 1m
  releaseName: grafana
  valuesFrom:
  - kind: ConfigMap
    name: grafana-values
    valuesKey: values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: elastic-repo
  namespace: flux-system
spec:
  interval: 10m
  url: https://helm.elastic.co
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-charts
  namespace: flux-system
spec:
  interval: 10m
  url: https://grafana.github.io/helm-charts
